# WAM video-only LoRA fine-tune — LTX-2.5, image + text -> video.
# Fill in every <PLACEHOLDER>; everything else is a working default.
# Run single-GPU (--num_processes 1): multi-GPU validation hits a DDP num_blocks bug.

model:
  # dev checkpoint, not distilled — distilled is for few-step inference only.
  model_path:        "<LTX_MODELS>/diffusion_models/ltx-2.5-22b-dev-transformer-bf16.safetensors"
  text_encoder_path: "<LTX_MODELS>/text_encoders/gemma4-12b-with-proj-ltx-2.5-bf16.safetensors"
  video_vae_path:    "<LTX_MODELS>/vae/ltx-2.5-video-vae-bf16.safetensors"
  training_mode: "lora"
  # Optional. A lora_weights_step_*.safetensors, to resume or to re-run validation
  # against a trained checkpoint. It restores the step counter, so
  # optimization.steps must exceed that step or the run exits with nothing to do.
  load_checkpoint: null

lora:
  # rank 32 ~= 100M trainable params. alpha conventionally equals rank.
  rank: 32
  alpha: 32
  dropout: 0.0
  # Attention projections only — recommended for video-only fine-tuning.
  target_modules:
    - "attn1.to_k"
    - "attn1.to_q"
    - "attn1.to_v"
    - "attn1.to_out.0"
    - "attn2.to_k"
    - "attn2.to_q"
    - "attn2.to_v"
    - "attn2.to_out.0"

training_strategy:
  name: "flexible"
  video:
    is_generated: true
    latents_dir: "latents"
    conditions:
      # probability 1.0 = always image-conditioned (i2v).
      # Lower it to mix in text-only samples.
      - type: first_frame
        probability: 1.0

optimization:
  learning_rate: 1e-4
  # Watch epochs = steps * grad_accum / num_clips. Past ~50 you are memorising.
  steps: 2000
  # Must be 1 when the preprocessed data spans more than one resolution bucket.
  batch_size: 1
  gradient_accumulation_steps: 1
  max_grad_norm: 1.0
  optimizer_type: "adamw"
  scheduler_type: "linear"
  scheduler_params: {}
  # Keep true. Trades compute for memory; without it 80GB is not enough.
  enable_gradient_checkpointing: true

acceleration:
  mixed_precision_mode: "bf16"
  quantization: null
  # true frees ~12GB by loading Gemma in 8-bit, at some prompt-embedding precision.
  # Turn on only if you OOM.
  load_text_encoder_in_8bit: false
  # Keep true — an 80GB card has almost no headroom during validation.
  offload_optimizer_during_validation: true

data:
  # Output of scripts/process_dataset.py — contains latents/ and conditions/.
  preprocessed_data_root: "<DATA_ROOT>"
  num_dataloader_workers: 4

validation:
  # [width, height, frames]. frames must satisfy (f - 1) % 8 == 0.
  # LTX-2.5 RoPE caps time at 20s — at 15 fps that is 297 frames.
  video_dims: [<W>, <H>, <F>]
  frame_rate: 15.0
  seed: 42
  inference_steps: 30
  # WARNING: null disables validation ENTIRELY, including the step-0 run.
  interval: 100
  generate_audio: false
  # Classifier-free guidance. Raise toward 4-5 if the prompt is being ignored.
  video_cfg_scale: 3.0
  skip_initial_validation: false
  # Prompts should match the caption style produced by build_ltx_manifest.py.
  # Use a first frame from a HELD-OUT episode, and vary the action phrase between
  # samples to check the prompt actually steers the motion.
  samples:
    - prompt: "<VALIDATION_PROMPT_A>"
      conditions:
        - type: first_frame
          image_or_video: "<VAL_FRAME>"
    # Per-sample video_dims overrides the block default — useful for checking
    # behaviour at a longer horizon.
    - prompt: "<VALIDATION_PROMPT_B>"
      video_dims: [<W>, <H>, <F>]
      conditions:
        - type: first_frame
          image_or_video: "<VAL_FRAME>"

wandb:
  enabled: true
  project: "ltx-wam"
  entity: null
  tags: ["ltx2.5", "lora", "video-only"]
  log_validation_videos: true

checkpoints:
  interval: 250
  keep_last_n: -1        # -1 keeps every checkpoint

output_dir: "<OUTPUT_DIR>"
